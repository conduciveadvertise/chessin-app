name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    # 1. Secret ko Job-level environment variable mein map karein
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Expo and EAS CLI
        run: |
          npm install -g expo-cli eas-cli

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Export web bundle
        run: npx expo export

      - name: Create eas.json if missing
        run: |
          if [ ! -f eas.json ]; then
            echo '{"cli":{"version":">= 5.9.0"},"build":{"preview":{"android":{"buildType":"apk"},"distribution":"internal"},"production":{"android":{"buildType":"apk"}}},"submit":{"production":{}}}' > eas.json
          fi

      # 2. 'secrets' ki jagah 'env' context ka use karein
      - name: Build Android APK with EAS
        if: env.EXPO_TOKEN != ''
        run: eas build --platform android --profile preview --non-interactive --no-wait

      # 3. Yahan bhi 'env' context ka use karein
      - name: Skip EAS build (no EXPO_TOKEN)
        if: env.EXPO_TOKEN == ''
        run: |
          echo "EXPO_TOKEN secret is not set. Skipping EAS build step."
          echo "To enable EAS builds, add the EXPO_TOKEN secret in repository settings."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: chessin-android-apk
          path: |
            *.apk
            android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: warn
